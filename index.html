<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yolculuk Alarmı</title>
<meta name="description" content="Yolculuk Alarmı: durağa yaklaşınca çalan alarm.">
<style>
:root{--bg:#f7f6f3;--card:#ffffff;--text:#1c1c1e;--muted:#6b6b70;--accent:#b25000;--line:#e4e2dc}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--card:#1c1c1f;--text:#f2f2f4;--muted:#a0a0a6;--accent:#ffb340;--line:#2c2c30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.badge{width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#ffb340,#ff9500);flex:none}
.app{font-weight:600;color:var(--muted);font-size:15px}
h1{font-size:30px;line-height:1.2;margin:16px 0 4px}
h2{font-size:20px;margin:32px 0 8px;padding-top:24px;border-top:1px solid var(--line)}
p,li{color:var(--text)}
.meta{color:var(--muted);font-size:15px;margin-top:0}
ul{padding-left:22px}
li{margin:6px 0}
a{color:var(--accent);text-decoration:none;word-break:break-word}
a:hover{text-decoration:underline}
.links{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.links a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-weight:600}
footer{margin-top:48px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<header><div class="badge" aria-hidden="true"></div><div class="app">Yolculuk Alarmı</div></header>
<h1>Yolculuk Alarmı</h1>
<p class="meta">iPhone için varış alarmı</p>
<p>Serviste ya da otobüste ineceğiniz durağa yaklaştığınızda, seçtiğiniz süre kala alarm çalar.</p>
<div class="links">
<a href="gizlilik/">Gizlilik politikası</a>
<a href="mailto:fil.fuat@icloud.com">Destek: fil.fuat@icloud.com</a>
</div>
<footer>© 2026 Yolculuk Alarmı</footer>
</main>
</body>
</html>
